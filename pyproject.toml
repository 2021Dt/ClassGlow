[project]
name = "kanban"
version = "0.1.0"
description = "教室桌面看板管理服务"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<2.2",
  "psycopg[binary]>=3.2,<4",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic-settings>=2.7,<3",
  "alembic>=1.14,<2",
  "qrcode[pil]>=8,<9",
  "tzdata>=2025.2,<2028",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint.flake8-bugbear]
# FastAPI 依赖声明是框架定义的不可变参数描述，不是共享的可变默认值。
extend-immutable-calls = ["fastapi.Depends"]
