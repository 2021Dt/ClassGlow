# 下载限制只用于本项目 /downloads/；共享内存跨 worker 计数，旧版直链也不能绕过。
# 以连接来源 IP 计数，不信任访客自行填写的 X-Forwarded-For。
limit_req_zone $binary_remote_addr zone=classglow_download_requests:2m rate=@DOWNLOAD_REQUESTS@r/m;
limit_req_zone $server_name zone=classglow_download_requests_total:64k rate=@DOWNLOAD_REQUESTS_TOTAL@r/m;
limit_conn_zone $binary_remote_addr zone=classglow_download_connections:2m;
limit_conn_zone $server_name zone=classglow_download_connections_total:64k;

server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;
    access_log off;
    location ^~ /.well-known/acme-challenge/ { root /opt/classglow/.deploy/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name @DOMAIN@;
    ssl_certificate /etc/letsencrypt/live/@DOMAIN@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@DOMAIN@/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    access_log off;
    client_max_body_size 2m;
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 覆盖外部自带的转发头，Caddy 再将真实来源传给 API。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
    location ^~ /downloads/ {
        alias /opt/classglow/.deploy/downloads/;
        autoindex off;
        limit_except GET { deny all; }

        # 同时约束请求频率、并发与传输速度；不给每次重连一个不限速下载区间。
        limit_req zone=classglow_download_requests burst=3 nodelay;
        limit_req zone=classglow_download_requests_total burst=8 nodelay;
        limit_req_status 429;
        limit_req_log_level notice;
        limit_conn classglow_download_connections @DOWNLOAD_CONNECTIONS@;
        limit_conn classglow_download_connections_total @DOWNLOAD_CONNECTIONS_TOTAL@;
        limit_conn_status 429;
        limit_conn_log_level notice;
        limit_rate @DOWNLOAD_RATE@k;
        limit_rate_after 0;
        send_timeout 30s;

        # 保留单段断点续传。多段 Range 直接拒绝，避免退化为发送整个安装包。
        if ($http_range ~ ",") { return 416; }
        max_ranges 1;
        types { }
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=86400";
        error_page 429 /download-busy.html;
    }
    location = /download-busy.html {
        internal;
        alias /opt/classglow/frontend/public/download-busy.html;
        default_type text/html;
        charset utf-8;
        add_header Retry-After "60" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
